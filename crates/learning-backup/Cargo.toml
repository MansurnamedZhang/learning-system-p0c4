[package]
name = "learning-backup"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Deliberate deployment gate. `--all-features` alone is insufficient: the
# reviewed build must also embed KNOWWEAVE_C4_VERIFIER_KEY_SHA256.
independent-verifier = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
uuid.workspace = true
sqlx.workspace = true
learning-assets = { path = "../learning-assets" }
learning-db = { path = "../learning-db" }
tokio.workspace = true
ring = "0.17.14"
hex = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
