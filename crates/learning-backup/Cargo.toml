[package]
name = "learning-backup"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Deliberate deployment gate. `--all-features` alone is insufficient: the
# reviewed build must also embed KNOWWEAVE_C4_VERIFIER_KEY_SHA256.
independent-verifier = []
# Default-off original process roles. Role/profile/key pins and actual installed
# admission remain additional gates; Source publication and receiver are closed.
offhost-b1 = ["independent-verifier", "learning-db/b1-source-peer"]

[[bin]]
name = "knowweave-c4-b1-source"
path = "src/bin/knowweave-c4-b1-source.rs"
required-features = ["offhost-b1"]

[[bin]]
name = "knowweave-c4-b1-capture"
path = "src/bin/knowweave-c4-b1-capture.rs"
required-features = ["offhost-b1"]

[[bin]]
name = "knowweave-c4-b1-source-launcher"
path = "src/bin/knowweave-c4-b1-source-launcher.rs"
required-features = ["offhost-b1"]

[[bin]]
name = "knowweave-c4-b1-receiver"
path = "src/bin/knowweave-c4-b1-receiver.rs"
required-features = ["offhost-b1"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
uuid.workspace = true
sqlx.workspace = true
learning-assets = { path = "../learning-assets" }
learning-db = { path = "../learning-db" }
learning-core = { path = "../learning-core" }
tokio = { workspace = true, features = ["process", "io-util"] }
ring = "0.17.14"
hex = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
