<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>知织 · 阅读工作台</title>
  <link rel="stylesheet" href="/ui.css">
  <script defer src="/ui.js"></script>
</head>
<body>
  <header class="masthead">
    <a class="brand" href="/" aria-label="知织阅读工作台"><span class="mark" aria-hidden="true">织</span>知织<span class="wordmark">KNOWWEAVE</span></a>
    <span class="lab">合成数据 · 阅读与笔记</span>
  </header>
  <main>
    <section id="login" class="sign-in" hidden>
      <p class="kicker">READING / 01</p>
      <h1>打开阅读工作台</h1>
      <p>输入启动终端中的本次访问码。每个访问码对应一个合成身份。</p>
      <form id="login-form" method="post" action="/api/session" autocomplete="off">
        <label for="code">本次访问码</label>
        <input id="code" type="password" minlength="64" maxlength="64" required autocomplete="off" spellcheck="false">
        <button type="submit">打开预览</button>
      </form>
    </section>

    <section id="reader" class="layout" hidden>
      <aside class="rail">
        <p class="kicker">阅读工作台</p>
        <p id="rail-description">浏览这次预览中的固定阅读版本。</p>
        <nav id="outline" aria-label="当前可见内容"></nav>
      </aside>
      <article class="document" aria-labelledby="document-title">
        <header class="document-head">
          <div class="document-tools">
            <p class="kicker">学习手稿 / 版本化阅读</p>
            <button type="button" id="logout" class="quiet">退出</button>
          </div>
          <h1 id="document-title" tabindex="-1">阅读</h1>
          <p id="edition" class="edition"></p>
          <div class="modes" role="group" aria-label="阅读视图">
            <button type="button" data-mode="original" aria-pressed="false">原文</button>
            <button type="button" data-mode="fused" aria-pressed="true">融合</button>
            <button type="button" data-mode="personal" aria-pressed="false">个人</button>
          </div>
        </header>
        <div id="entries" aria-busy="false"></div>
        <section id="note-editor" class="note-editor" aria-labelledby="note-title" hidden>
          <h2 id="note-title">追加私有笔记</h2>
          <p id="note-location">笔记放在「缩放与掩码」之后、第二次「查询、键与值」之前，仅本次学习者可见。</p>
          <form id="note-form" autocomplete="off">
            <label for="note-text">笔记正文</label>
            <textarea id="note-text" rows="4" required aria-describedby="note-location note-limit"></textarea>
            <p id="note-limit">最多 4,000 字节，按纯文本显示。</p>
            <div class="note-actions">
              <button type="submit" id="note-save">保存笔记</button>
              <button type="button" id="note-latest" class="quiet" hidden>载入最新修订</button>
            </div>
          </form>
          <p id="note-status" role="status"></p>
        </section>
        <section id="detached" class="detached" aria-labelledby="detached-title" hidden>
          <h2 id="detached-title">未定位的个人笔记</h2>
          <div id="unplaced"></div>
        </section>
      </article>
    </section>
    <section id="denied" class="sign-in" hidden>
      <h1>无法打开这份阅读</h1>
      <p>当前会话无法查看此阅读。</p>
      <button type="button" id="change-seat">更换访问码</button>
    </section>
    <p id="status" class="status" role="status">正在连接本次预览…</p>
  </main>
</body>
</html>
