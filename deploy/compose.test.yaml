name: learning-system-p0b3-test
services:
  pg:
    image: postgres:18.6-bookworm@sha256:9e73daeb439141c2b11eea2463f5f1a3b269fd90d897b41cddb7cb440f21aa5d
    cpus: 2
    mem_limit: 4g
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password, admin_password, runtime_password]
    volumes:
      - test_pg:/var/lib/postgresql
      - ./initdb.sh:/docker-entrypoint-initdb.d/10-learning.sh:ro
    networks: [test]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d learning_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  test:
    profiles: [test]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.test
    cpus: 4
    mem_limit: 4g
    environment:
      CARGO_BUILD_JOBS: 4
    secrets: [admin_password, runtime_password, postgres_password]
    volumes:
      - test_evidence:/evidence
      - test_assets:/assets
      - test_staging:/staging
    depends_on:
      pg: {condition: service_healthy}
    networks: [test]
networks:
  test: {internal: true}
volumes:
  test_pg:
  test_evidence:
  test_assets:
  test_staging:
secrets:
  postgres_password: {file: ../.runtime/secrets/postgres_password}
  admin_password: {file: ../.runtime/secrets/admin_password}
  runtime_password: {file: ../.runtime/secrets/runtime_password}
