<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 614" role="img" aria-labelledby="crates-title crates-desc"><title id="crates-title">03 · Rust 代码与授权边界</title><desc id="crates-desc">实线显示现有模块依赖与运行接口；虚线表示未来接入。crate 是代码模块，不是独立网络服务。</desc><style>
:root{--paper:#ffffff;--ink:#172338;--muted:#506078;--edge:#6b7b92;--line:#c7d0df;--done:#eaf5ee;--done-ink:#246547;--next:#ebf1ff;--next-ink:#294ea5;--planned:#f2f4f8;--planned-ink:#506078;--optional:#f3ecfb;--optional-ink:#714993;--neutral:#fafbfc;}
@media(prefers-color-scheme:dark){:root{--paper:#131b29;--ink:#e6edf7;--muted:#b0bdd0;--edge:#97a9c0;--line:#415269;--done:#163a2d;--done-ink:#8fd8b3;--next:#203758;--next-ink:#a7c2ff;--planned:#283447;--planned-ink:#c1ccdc;--optional:#382c49;--optional-ink:#d3b5f2;--neutral:#202b3b;}}
text{font-family:'Microsoft YaHei','PingFang SC',system-ui,sans-serif;fill:var(--ink)}.node rect{fill:var(--planned);stroke:var(--line);stroke-width:1}.node.done rect{fill:var(--done)}.node.next rect{fill:var(--next)}.node.optional rect{fill:var(--optional)}.node.neutral rect{fill:var(--neutral)}.state{font-size:11px;letter-spacing:1px;fill:var(--planned-ink)}.done .state{fill:var(--done-ink)}.next .state{fill:var(--next-ink)}.optional .state{fill:var(--optional-ink)}.node-title{font-size:16px;font-weight:600}.node-body{font-size:13px;fill:var(--muted)}.edge{fill:none;stroke:var(--edge);stroke-width:1.4}.optional-edge{stroke-dasharray:5 4}.edge-label{font-size:12px;fill:var(--muted)}</style><defs><marker id="crates-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--edge)"/></marker></defs><rect width="1120" height="614" fill="var(--paper)"/><path class="edge optional-edge" d="M217,70 L217,42 L567,42 L567,70" marker-end="url(#crates-arrow)"/><rect x="357.6" y="21" width="68.80000000000001" height="19" fill="var(--paper)" opacity=".96"/><text class="edge-label" x="392" y="34" text-anchor="middle">JSON API</text><path class="edge optional-edge" d="M567,170 L567,228" marker-end="url(#crates-arrow)"/><rect x="572" y="178" width="77" height="19" fill="var(--paper)" opacity=".96"/><text class="edge-label" x="577" y="191" text-anchor="start">身份和命令</text><path class="edge" d="M917,170 L917,199 L567,199 L567,228" marker-end="url(#crates-arrow)"/><rect x="831.5" y="181" width="77" height="19" fill="var(--paper)" opacity=".96"/><text class="edge-label" x="870" y="194" text-anchor="middle">作业与授权</text><path class="edge" d="M917,170 L917,228" marker-end="url(#crates-arrow)"/><rect x="922" y="178" width="64" height="19" fill="var(--paper)" opacity=".96"/><text class="edge-label" x="927" y="191" text-anchor="start">核对原件</text><path class="edge" d="M1064,120 L1088,118 L1088,208 L45,208 L45,270 L70,270 L70,278" marker-end="url(#crates-arrow)"/><rect x="131" y="187" width="38" height="19" fill="var(--paper)" opacity=".96"/><text class="edge-label" x="150" y="200" text-anchor="middle">契约</text><path class="edge" d="M567,228 L567,200 L217,200 L217,228" marker-end="url(#crates-arrow)"/><rect x="349.35" y="179" width="85.30000000000001" height="19" fill="var(--paper)" opacity=".96"/><text class="edge-label" x="392" y="192" text-anchor="middle">类型 / 校验</text><path class="edge" d="M567,228 L567,200 L917,200 L917,228" marker-end="url(#crates-arrow)"/><rect x="703.5" y="179" width="77" height="19" fill="var(--paper)" opacity=".96"/><text class="edge-label" x="742" y="192" text-anchor="middle">字节先就绪</text><path class="edge" d="M917,328 L917,355 L217,355 L217,328" marker-end="url(#crates-arrow)"/><rect x="528.5" y="354" width="77" height="19" fill="var(--paper)" opacity=".96"/><text class="edge-label" x="567" y="367" text-anchor="middle">快照包契约</text><path class="edge" d="M567,328 L567,386" marker-end="url(#crates-arrow)"/><rect x="572" y="336" width="79.4" height="19" fill="var(--paper)" opacity=".96"/><text class="edge-label" x="577" y="349" text-anchor="start">参数化 SQL</text><path class="edge" d="M917,328 L917,386" marker-end="url(#crates-arrow)"/><rect x="922" y="336" width="66.4" height="19" fill="var(--paper)" opacity=".96"/><text class="edge-label" x="927" y="349" text-anchor="start">流式 I/O</text><path class="edge" d="M217,386 L217,347 L567,347 L567,328" marker-end="url(#crates-arrow)"/><rect x="360" y="334" width="64" height="19" fill="var(--paper)" opacity=".96"/><text class="edge-label" x="392" y="347" text-anchor="middle">直接依赖</text><path class="edge" d="M70,436 L25,436 L25,525 L1095,525 L1095,278 L1064,278" marker-end="url(#crates-arrow)"/><rect x="535" y="505" width="64" height="19" fill="var(--paper)" opacity=".96"/><text class="edge-label" x="567" y="518" text-anchor="middle">直接依赖</text><path class="edge" d="M217,386 L217,358 L567,358 L567,386" marker-end="url(#crates-arrow)"/><rect x="360" y="363" width="64" height="19" fill="var(--paper)" opacity=".96"/><text class="edge-label" x="392" y="376" text-anchor="middle">受控管理</text><g class="node planned" data-node="web"><rect x="70" y="70" width="294" height="100" rx="9"/><text x="86" y="90" class="state">待建设</text><text x="86" y="114" class="node-title">apps/web 待建设</text><text x="86" y="136" class="node-body">编辑草稿与用户交互</text><text x="86" y="155" class="node-body">不直连数据库或文件目录</text></g><g class="node planned" data-node="api"><rect x="420" y="70" width="294" height="100" rx="9"/><text x="436" y="90" class="state">待建设</text><text x="436" y="114" class="node-title">learning-api 待建设</text><text x="436" y="136" class="node-body">HTTP 身份 → 业务 actor</text><text x="436" y="155" class="node-body">稳定 DTO / 幂等与冲突语义</text></g><g class="node done" data-node="worker"><rect x="770" y="70" width="294" height="100" rx="9"/><text x="786" y="90" class="state">已验收</text><text x="786" y="114" class="node-title">learning-worker</text><text x="786" y="136" class="node-body">进程循环 / 处理器 / 停止恢复</text><text x="786" y="155" class="node-body">非 owner runtime 登录</text></g><g class="node done" data-node="core"><rect x="70" y="228" width="294" height="100" rx="9"/><text x="86" y="248" class="state">已验收</text><text x="86" y="272" class="node-title">learning-core</text><text x="86" y="294" class="node-body">版本化契约 / 校验 / 摘要</text><text x="86" y="313" class="node-body">块、位置、关系、资产、任务</text></g><g class="node done" data-node="db"><rect x="420" y="228" width="294" height="100" rx="9"/><text x="436" y="248" class="state">已验收</text><text x="436" y="272" class="node-title">learning-db</text><text x="436" y="294" class="node-body">SQLx / 显式事务 / 授权查询</text><text x="436" y="313" class="node-body">发布、融合视图、关系、作业</text></g><g class="node done" data-node="assets"><rect x="770" y="228" width="294" height="100" rx="9"/><text x="786" y="248" class="state">已验收</text><text x="786" y="272" class="node-title">learning-assets</text><text x="786" y="294" class="node-body">不可变字节 / staging / 校验</text><text x="786" y="313" class="node-body">Filesystem 原件存储</text></g><g class="node done" data-node="pg"><rect x="420" y="386" width="294" height="100" rx="9"/><text x="436" y="406" class="state">已验收</text><text x="436" y="430" class="node-title">PostgreSQL 内部接口</text><text x="436" y="452" class="node-body">最小权限 / 限定数据库函数</text><text x="436" y="471" class="node-body">业务行、收据、两个独立 outbox</text></g><g class="node done" data-node="file"><rect x="770" y="386" width="294" height="100" rx="9"/><text x="786" y="406" class="state">已验收</text><text x="786" y="430" class="node-title">文件系统存储卷</text><text x="786" y="452" class="node-body">原件只读；staging 私有可写</text><text x="786" y="471" class="node-body">C3 挂私有可写 snapshots</text></g><g class="node next" data-node="backup"><rect x="70" y="386" width="294" height="100" rx="9"/><text x="86" y="406" class="state">实施中</text><text x="86" y="430" class="node-title">learning-backup</text><text x="86" y="452" class="node-body">C4 管理侧备份与恢复绑定</text><text x="86" y="471" class="node-body">高权凭据不下发给 Worker</text></g></svg>