<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 772" role="img" aria-labelledby="domain-title domain-desc"><title id="domain-title">02 · 块、位置与版本关系</title><desc id="domain-desc">箭头统一由持有者或引用者指向目标；省略部分约束字段，不把对象画成独立服务。</desc><style>
:root{--paper:#ffffff;--ink:#172338;--muted:#506078;--edge:#6b7b92;--line:#c7d0df;--done:#eaf5ee;--done-ink:#246547;--next:#ebf1ff;--next-ink:#294ea5;--planned:#f2f4f8;--planned-ink:#506078;--optional:#f3ecfb;--optional-ink:#714993;--neutral:#fafbfc;}
@media(prefers-color-scheme:dark){:root{--paper:#131b29;--ink:#e6edf7;--muted:#b0bdd0;--edge:#97a9c0;--line:#415269;--done:#163a2d;--done-ink:#8fd8b3;--next:#203758;--next-ink:#a7c2ff;--planned:#283447;--planned-ink:#c1ccdc;--optional:#382c49;--optional-ink:#d3b5f2;--neutral:#202b3b;}}
text{font-family:'Microsoft YaHei','PingFang SC',system-ui,sans-serif;fill:var(--ink)}.node rect{fill:var(--planned);stroke:var(--line);stroke-width:1}.node.done rect{fill:var(--done)}.node.next rect{fill:var(--next)}.node.optional rect{fill:var(--optional)}.node.neutral rect{fill:var(--neutral)}.state{font-size:11px;letter-spacing:1px;fill:var(--planned-ink)}.done .state{fill:var(--done-ink)}.next .state{fill:var(--next-ink)}.optional .state{fill:var(--optional-ink)}.node-title{font-size:16px;font-weight:600}.node-body{font-size:13px;fill:var(--muted)}.edge{fill:none;stroke:var(--edge);stroke-width:1.4}.optional-edge{stroke-dasharray:5 4}.edge-label{font-size:12px;fill:var(--muted)}</style><defs><marker id="domain-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--edge)"/></marker></defs><rect width="1120" height="772" fill="var(--paper)"/><path class="edge" d="M70,120 L42,120 L42,704 L567,704 L567,644" marker-end="url(#domain-arrow)"/><rect x="259.5" y="683" width="90" height="19" fill="var(--paper)" opacity=".96"/><text class="edge-label" x="304.5" y="696" text-anchor="middle">持有修订历史</text><path class="edge" d="M567,170 L567,199 L217,199 L217,228" marker-end="url(#domain-arrow)"/><rect x="347" y="178" width="90" height="19" fill="var(--paper)" opacity=".96"/><text class="edge-label" x="392" y="191" text-anchor="middle">固定原文基线</text><path class="edge" d="M567,170 L567,228" marker-end="url(#domain-arrow)"/><rect x="572" y="178" width="77" height="19" fill="var(--paper)" opacity=".96"/><text class="edge-label" x="577" y="191" text-anchor="start">固定个人层</text><path class="edge" d="M567,170 L567,199 L917,199 L917,228" marker-end="url(#domain-arrow)"/><rect x="697" y="178" width="90" height="19" fill="var(--paper)" opacity=".96"/><text class="edge-label" x="742" y="191" text-anchor="middle">固定关系选择</text><path class="edge" d="M217,328 L217,386" marker-end="url(#domain-arrow)"/><rect x="222" y="336" width="90" height="19" fill="var(--paper)" opacity=".96"/><text class="edge-label" x="227" y="349" text-anchor="start">固定有序成员</text><path class="edge" d="M567,328 L567,386" marker-end="url(#domain-arrow)"/><rect x="572" y="336" width="90" height="19" fill="var(--paper)" opacity=".96"/><text class="edge-label" x="577" y="349" text-anchor="start">固定个人位置</text><path class="edge" d="M217,486 L217,515 L567,515 L567,544" marker-end="url(#domain-arrow)"/><rect x="353.5" y="494" width="77" height="19" fill="var(--paper)" opacity=".96"/><text class="edge-label" x="392" y="507" text-anchor="middle">精确块引用</text><path class="edge" d="M567,486 L567,544" marker-end="url(#domain-arrow)"/><rect x="572" y="494" width="77" height="19" fill="var(--paper)" opacity=".96"/><text class="edge-label" x="577" y="507" text-anchor="start">个人块引用</text><path class="edge" d="M1064,278 L1090,278 L1090,668 L567,668 L567,644" marker-end="url(#domain-arrow)"/><rect x="796.5" y="647" width="64" height="19" fill="var(--paper)" opacity=".96"/><text class="edge-label" x="828.5" y="660" text-anchor="middle">固定端点</text><path class="edge" d="M917,386 L917,328" marker-end="url(#domain-arrow)"/><rect x="922" y="336" width="90" height="19" fill="var(--paper)" opacity=".96"/><text class="edge-label" x="927" y="349" text-anchor="start">证据关系选择</text><path class="edge" d="M770,120 L742,120 L742,594 L770,594" marker-end="url(#domain-arrow)"/><rect x="747" y="340" width="64" height="19" fill="var(--paper)" opacity=".96"/><text class="edge-label" x="752" y="353" text-anchor="start">固定原件</text><path class="edge" d="M567,544 L567,516 L917,516 L917,544" marker-end="url(#domain-arrow)"/><rect x="686.35" y="495" width="111.3" height="19" fill="var(--paper)" opacity=".96"/><text class="edge-label" x="742" y="508" text-anchor="middle">v3 精确资产使用</text><path class="edge optional-edge" d="M70,594 L16,594 L16,20 L567,20 L567,70" marker-end="url(#domain-arrow)"/><rect x="238.5" y="1" width="103" height="19" fill="var(--paper)" opacity=".96"/><text class="edge-label" x="290" y="14" text-anchor="middle">固定内容上下文</text><g class="node done" data-node="block"><rect x="70" y="70" width="294" height="100" rx="9"/><text x="86" y="90" class="state">已验收</text><text x="86" y="114" class="node-title">Block 稳定身份</text><text x="86" y="136" class="node-body">用途 intent 与形式分开</text><text x="86" y="155" class="node-body">修订时不换稳定 ID</text></g><g class="node done" data-node="reading"><rect x="420" y="70" width="294" height="100" rx="9"/><text x="436" y="90" class="state">已验收</text><text x="436" y="114" class="node-title">ReadingViewRevision</text><text x="436" y="136" class="node-body">原文 + 个人层 + 关系选择</text><text x="436" y="155" class="node-body">Original / Fused / Personal</text></g><g class="node done" data-node="resource"><rect x="770" y="70" width="294" height="100" rx="9"/><text x="786" y="90" class="state">已验收</text><text x="786" y="114" class="node-title">ResourceVersion / Source</text><text x="786" y="136" class="node-body">逻辑资源的不可变版本</text><text x="786" y="155" class="node-body">页 / 区域 / cell / 时间定位</text></g><g class="node done" data-node="composition"><rect x="70" y="228" width="294" height="100" rx="9"/><text x="86" y="248" class="state">已验收</text><text x="86" y="272" class="node-title">Composition / Release</text><text x="86" y="294" class="node-body">固定有序组合与原子发布</text><text x="86" y="313" class="node-body">复用引用，不复制正文</text></g><g class="node done" data-node="overlay"><rect x="420" y="228" width="294" height="100" rx="9"/><text x="436" y="248" class="state">已验收</text><text x="436" y="272" class="node-title">OverlayRevision 个人层</text><text x="436" y="294" class="node-body">固定根文档和原文基线</text><text x="436" y="313" class="node-body">独立位置与个人块引用</text></g><g class="node done" data-node="relation"><rect x="770" y="228" width="294" height="100" rx="9"/><text x="786" y="248" class="state">已验收</text><text x="786" y="272" class="node-title">RelationRevision 语义边</text><text x="786" y="294" class="node-body">端点固定块修订</text><text x="786" y="313" class="node-body">支持 / 反对 / 启发等</text></g><g class="node done" data-node="occurrence"><rect x="70" y="386" width="294" height="100" rx="9"/><text x="86" y="406" class="state">已验收</text><text x="86" y="430" class="node-title">Occurrence 精确出现</text><text x="86" y="452" class="node-body">有序项 / 完整出现路径</text><text x="86" y="471" class="node-body">同一块可重复出现</text></g><g class="node done" data-node="placement"><rect x="420" y="386" width="294" height="100" rx="9"/><text x="436" y="406" class="state">已验收</text><text x="436" y="430" class="node-title">Placement / GapAnchor</text><text x="436" y="452" class="node-body">左右邻居 / 附着偏好</text><text x="436" y="471" class="node-body">未确定迁移项保持可找回</text></g><g class="node done" data-node="review"><rect x="770" y="386" width="294" height="100" rx="9"/><text x="786" y="406" class="state">已验收</text><text x="786" y="430" class="node-title">EpistemicReview 认识审查</text><text x="786" y="452" class="node-body">固定猜想与证据快照</text><text x="786" y="471" class="node-body">结论有条件；撤权后不泄露</text></g><g class="node planned" data-node="learning"><rect x="70" y="544" width="294" height="100" rx="9"/><text x="86" y="564" class="state">待建设</text><text x="86" y="588" class="node-title">学习事实与能力判断</text><text x="86" y="610" class="node-body">LearningRun / Plan / Attempt</text><text x="86" y="629" class="node-body">规则、产物和验收；P1-B</text></g><g class="node done" data-node="revision"><rect x="420" y="544" width="294" height="100" rx="9"/><text x="436" y="564" class="state">已验收</text><text x="436" y="588" class="node-title">BlockRevision 不可变正文</text><text x="436" y="610" class="node-body">精确 block_id + revision_id</text><text x="436" y="629" class="node-body">文本 / 引用 / 图片 / 附件</text></g><g class="node done" data-node="asset"><rect x="770" y="544" width="294" height="100" rx="9"/><text x="786" y="564" class="state">已验收</text><text x="786" y="588" class="node-title">Asset + 原件字节</text><text x="786" y="610" class="node-body">业务资产 ID ≠ 内容哈希</text><text x="786" y="629" class="node-body">精确 AssetUse 授权后读取</text></g></svg>