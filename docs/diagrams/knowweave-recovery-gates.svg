<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 524" role="img" aria-labelledby="recovery-gates-title recovery-gates-desc"><title id="recovery-gates-title">07 · Task9 双机关键路径</title><desc id="recovery-gates-desc">以已封存的 PG18 首启为当前入口。节点顺序表示证据依赖，各现场动作按其批准范围执行。</desc><style>
:root{--paper:#ffffff;--ink:#172338;--muted:#506078;--edge:#6b7b92;--line:#c7d0df;--done:#eaf5ee;--done-ink:#246547;--next:#ebf1ff;--next-ink:#294ea5;--planned:#f2f4f8;--planned-ink:#506078;--optional:#f3ecfb;--optional-ink:#714993;--neutral:#fafbfc;}
@media(prefers-color-scheme:dark){:root{--paper:#131b29;--ink:#e6edf7;--muted:#b0bdd0;--edge:#97a9c0;--line:#415269;--done:#163a2d;--done-ink:#8fd8b3;--next:#203758;--next-ink:#a7c2ff;--planned:#283447;--planned-ink:#c1ccdc;--optional:#382c49;--optional-ink:#d3b5f2;--neutral:#202b3b;}}
text{font-family:'Microsoft YaHei','PingFang SC',system-ui,sans-serif;fill:var(--ink)}.node rect{fill:var(--planned);stroke:var(--line);stroke-width:1}.node.done rect{fill:var(--done)}.node.next rect{fill:var(--next)}.node.optional rect{fill:var(--optional)}.node.neutral rect{fill:var(--neutral)}.state{font-size:11px;letter-spacing:1px;fill:var(--planned-ink)}.done .state{fill:var(--done-ink)}.next .state{fill:var(--next-ink)}.optional .state{fill:var(--optional-ink)}.node-title{font-size:16px;font-weight:600}.node-body{font-size:13px;fill:var(--muted)}.edge{fill:none;stroke:var(--edge);stroke-width:1.4}.optional-edge{stroke-dasharray:5 4}.edge-label{font-size:12px;fill:var(--muted)}</style><defs><marker id="recovery-gates-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--edge)"/></marker></defs><rect width="1120" height="524" fill="var(--paper)"/><path class="edge" d="M217,70 L217,42 L567,42 L567,70" marker-end="url(#recovery-gates-arrow)"/><rect x="360" y="21" width="64" height="19" fill="var(--paper)" opacity=".96"/><text class="edge-label" x="392" y="34" text-anchor="middle">全部通过</text><path class="edge" d="M217,70 L217,16 L917,16 L917,70" marker-end="url(#recovery-gates-arrow)"/><rect x="603.5" y="1" width="103" height="19" fill="var(--paper)" opacity=".96"/><text class="edge-label" x="655" y="14" text-anchor="middle">失败或证据缺项</text><path class="edge" d="M567,170 L567,199 L217,199 L217,228" marker-end="url(#recovery-gates-arrow)"/><rect x="360" y="178" width="64" height="19" fill="var(--paper)" opacity=".96"/><text class="edge-label" x="392" y="191" text-anchor="middle">两案证据</text><path class="edge" d="M364,278 L420,278" marker-end="url(#recovery-gates-arrow)"/><path class="edge" d="M714,278 L770,278" marker-end="url(#recovery-gates-arrow)"/><path class="edge" d="M917,328 L917,386" marker-end="url(#recovery-gates-arrow)"/><path class="edge" d="M770,436 L714,436" marker-end="url(#recovery-gates-arrow)"/><path class="edge" d="M420,436 L364,436" marker-end="url(#recovery-gates-arrow)"/><g class="node next" data-node="s1"><rect x="70" y="70" width="294" height="100" rx="9"/><text x="86" y="90" class="state">实施中</text><text x="86" y="114" class="node-title">S1 修订首启 · 待审批</text><text x="86" y="136" class="node-body">干净副本 · TasksMax=128</text><text x="86" y="155" class="node-body">容量、迁移、权限、资源、停机</text></g><g class="node planned" data-node="s2"><rect x="420" y="70" width="294" height="100" rx="9"/><text x="436" y="90" class="state">待建设</text><text x="436" y="114" class="node-title">S2 独立复核</text><text x="436" y="136" class="node-body">仅 S1 通过并停机后启动</text><text x="436" y="155" class="node-body">同等身份及停机证据</text></g><g class="node neutral" data-node="hold"><rect x="770" y="70" width="294" height="100" rx="9"/><text x="786" y="90" class="state">上下文</text><text x="786" y="114" class="node-title">保留 HOLD</text><text x="786" y="136" class="node-body">按精确身份停机留证</text><text x="786" y="155" class="node-body">原失败资源与证据封存</text></g><g class="node planned" data-node="binding"><rect x="70" y="228" width="294" height="100" rx="9"/><text x="86" y="248" class="state">待建设</text><text x="86" y="272" class="node-title">源端真实绑定与 ELF</text><text x="86" y="294" class="node-body">PG / Unix socket / control</text><text x="86" y="313" class="node-body">各案三角色独立构建</text></g><g class="node planned" data-node="admission"><rect x="420" y="228" width="294" height="100" rx="9"/><text x="436" y="248" class="state">待建设</text><text x="436" y="272" class="node-title">C 现场安装准入</text><text x="436" y="294" class="node-body">trust、父进程、固定视图</text><text x="436" y="313" class="node-body">Root / PG / C11 / S5 / FD</text></g><g class="node planned" data-node="d1"><rect x="770" y="228" width="294" height="100" rx="9"/><text x="786" y="248" class="state">待建设</text><text x="786" y="272" class="node-title">D1 首签与完成发布</text><text x="786" y="294" class="node-body">原 S 最终校验及持久 fence</text><text x="786" y="313" class="node-body">原 D 单次裁决与完整回执</text></g><g class="node planned" data-node="finalReview"><rect x="70" y="386" width="294" height="100" rx="9"/><text x="86" y="406" class="state">待建设</text><text x="86" y="430" class="node-title">独审与五门签结论</text><text x="86" y="452" class="node-body">负例、回归及原件独核</text><text x="86" y="471" class="node-body">Task9 与 C4 单列结论</text></g><g class="node planned" data-node="rb"><rect x="420" y="386" width="294" height="100" rx="9"/><text x="436" y="406" class="state">待建设</text><text x="436" y="430" class="node-title">D2 / RB 零源依赖</text><text x="436" y="452" class="node-body">仅隔离实验源访问面</text><text x="436" y="471" class="node-body">用 D 证据完成全量恢复</text></g><g class="node planned" data-node="ra"><rect x="770" y="386" width="294" height="100" rx="9"/><text x="786" y="406" class="state">待建设</text><text x="786" y="430" class="node-title">RA 与中断保全</text><text x="786" y="452" class="node-body">RA 干净目标正常恢复</text><text x="786" y="471" class="node-body">S2 / V2 中断保全 D1</text></g></svg>