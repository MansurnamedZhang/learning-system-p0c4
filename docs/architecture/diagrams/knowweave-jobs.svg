<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 772" role="img" aria-labelledby="jobs-title jobs-desc"><title id="jobs-title">04 · 持久任务与真实故障恢复</title><desc id="jobs-desc">C2 已验收路径：新事件来自精确 v3 块资产使用，采用至少一次执行与幂等结果。</desc><style>
:root{--paper:#ffffff;--ink:#172338;--muted:#506078;--edge:#6b7b92;--line:#c7d0df;--done:#eaf5ee;--done-ink:#246547;--next:#ebf1ff;--next-ink:#294ea5;--planned:#f2f4f8;--planned-ink:#506078;--optional:#f3ecfb;--optional-ink:#714993;--neutral:#fafbfc;}
@media(prefers-color-scheme:dark){:root{--paper:#131b29;--ink:#e6edf7;--muted:#b0bdd0;--edge:#97a9c0;--line:#415269;--done:#163a2d;--done-ink:#8fd8b3;--next:#203758;--next-ink:#a7c2ff;--planned:#283447;--planned-ink:#c1ccdc;--optional:#382c49;--optional-ink:#d3b5f2;--neutral:#202b3b;}}
text{font-family:'Microsoft YaHei','PingFang SC',system-ui,sans-serif;fill:var(--ink)}.node rect{fill:var(--planned);stroke:var(--line);stroke-width:1}.node.done rect{fill:var(--done)}.node.next rect{fill:var(--next)}.node.optional rect{fill:var(--optional)}.node.neutral rect{fill:var(--neutral)}.state{font-size:11px;letter-spacing:1px;fill:var(--planned-ink)}.done .state{fill:var(--done-ink)}.next .state{fill:var(--next-ink)}.optional .state{fill:var(--optional-ink)}.node-title{font-size:16px;font-weight:600}.node-body{font-size:13px;fill:var(--muted)}.edge{fill:none;stroke:var(--edge);stroke-width:1.4}.optional-edge{stroke-dasharray:5 4}.edge-label{font-size:12px;fill:var(--muted)}</style><defs><marker id="jobs-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--edge)"/></marker></defs><rect width="1120" height="772" fill="var(--paper)"/><path class="edge" d="M217,70 L217,42 L567,42 L567,70" marker-end="url(#jobs-arrow)"/><rect x="353.5" y="21" width="77" height="19" fill="var(--paper)" opacity=".96"/><text class="edge-label" x="392" y="34" text-anchor="middle">校验后提交</text><path class="edge" d="M567,70 L567,42 L917,42 L917,70" marker-end="url(#jobs-arrow)"/><rect x="703.5" y="21" width="77" height="19" fill="var(--paper)" opacity=".96"/><text class="edge-label" x="742" y="34" text-anchor="middle">原子持久化</text><path class="edge" d="M917,170 L917,228" marker-end="url(#jobs-arrow)"/><rect x="922" y="178" width="64" height="19" fill="var(--paper)" opacity=".96"/><text class="edge-label" x="927" y="191" text-anchor="start">事务转投</text><path class="edge" d="M917,228 L917,200 L567,200 L567,228" marker-end="url(#jobs-arrow)"/><rect x="723" y="179" width="38" height="19" fill="var(--paper)" opacity=".96"/><text class="edge-label" x="742" y="192" text-anchor="middle">领取</text><path class="edge" d="M567,228 L567,200 L217,200 L217,228" marker-end="url(#jobs-arrow)"/><rect x="360" y="179" width="64" height="19" fill="var(--paper)" opacity=".96"/><text class="edge-label" x="392" y="192" text-anchor="middle">精确输入</text><path class="edge" d="M217,328 L217,386" marker-end="url(#jobs-arrow)"/><rect x="222" y="336" width="64" height="19" fill="var(--paper)" opacity=".96"/><text class="edge-label" x="227" y="349" text-anchor="start">处理成功</text><path class="edge" d="M217,486 L217,544" marker-end="url(#jobs-arrow)"/><rect x="222" y="494" width="64" height="19" fill="var(--paper)" opacity=".96"/><text class="edge-label" x="227" y="507" text-anchor="start">提交结果</text><path class="edge" d="M567,328 L567,386" marker-end="url(#jobs-arrow)"/><rect x="572" y="336" width="64" height="19" fill="var(--paper)" opacity=".96"/><text class="edge-label" x="577" y="349" text-anchor="start">进程丢失</text><path class="edge" d="M567,486 L567,544" marker-end="url(#jobs-arrow)"/><rect x="572" y="494" width="152.69999999999996" height="19" fill="var(--paper)" opacity=".96"/><text class="edge-label" x="577" y="507" text-anchor="start">新租约使旧 token 失效</text><path class="edge" d="M567,328 L567,357 L917,357 L917,386" marker-end="url(#jobs-arrow)"/><rect x="686.35" y="336" width="111.3" height="19" fill="var(--paper)" opacity=".96"/><text class="edge-label" x="742" y="349" text-anchor="middle">受控终止 / 重试</text><g class="node done" data-node="write"><rect x="70" y="70" width="294" height="100" rx="9"/><text x="86" y="90" class="state">已验收</text><text x="86" y="114" class="node-title">真实 v3 块写入</text><text x="86" y="136" class="node-body">Figure / Attachment</text><text x="86" y="155" class="node-body">request_id 幂等</text></g><g class="node done" data-node="tx"><rect x="420" y="70" width="294" height="100" rx="9"/><text x="436" y="90" class="state">已验收</text><text x="436" y="114" class="node-title">同一业务事务</text><text x="436" y="136" class="node-body">BlockRevision + block_asset_use</text><text x="436" y="155" class="node-body">同时写 job_outbox</text></g><g class="node done" data-node="outbox"><rect x="770" y="70" width="294" height="100" rx="9"/><text x="786" y="90" class="state">已验收</text><text x="786" y="114" class="node-title">job_outbox 持久事件</text><text x="786" y="136" class="node-body">actor + 精确 BlockRef</text><text x="786" y="155" class="node-body">处理器版本 / 稳定业务键</text></g><g class="node done" data-node="handler"><rect x="70" y="228" width="294" height="100" rx="9"/><text x="86" y="248" class="state">已验收</text><text x="86" y="272" class="node-title">资产完整性处理器</text><text x="86" y="294" class="node-body">按原 actor 重验当前授权</text><text x="86" y="313" class="node-body">核对大小与 SHA-256</text></g><g class="node done" data-node="lease"><rect x="420" y="228" width="294" height="100" rx="9"/><text x="436" y="248" class="state">已验收</text><text x="436" y="272" class="node-title">Worker 原子领取租约</text><text x="436" y="294" class="node-body">数据库时间 + 新 token</text><text x="436" y="313" class="node-body">attempt / lease_until</text></g><g class="node done" data-node="job"><rect x="770" y="228" width="294" height="100" rx="9"/><text x="786" y="248" class="state">已验收</text><text x="786" y="272" class="node-title">原子转投为唯一 job</text><text x="786" y="294" class="node-body">事件与作业一一收敛</text><text x="786" y="313" class="node-body">重复 / 并发转投不增任务</text></g><g class="node done" data-node="complete"><rect x="70" y="386" width="294" height="100" rx="9"/><text x="86" y="406" class="state">已验收</text><text x="86" y="430" class="node-title">带 token 的原子完成</text><text x="86" y="452" class="node-body">写 asset_integrity_result</text><text x="86" y="471" class="node-body">同事务标记 succeeded</text></g><g class="node done" data-node="takeover"><rect x="420" y="386" width="294" height="100" rx="9"/><text x="436" y="406" class="state">已验收</text><text x="436" y="430" class="node-title">进程终止后的接管</text><text x="436" y="452" class="node-body">真实 SIGKILL → 租约到期</text><text x="436" y="471" class="node-body">第二 Worker 领取新 token</text></g><g class="node done" data-node="terminal"><rect x="770" y="386" width="294" height="100" rx="9"/><text x="786" y="406" class="state">已验收</text><text x="786" y="430" class="node-title">取消 / 撤权 / 有限失败</text><text x="786" y="452" class="node-body">cancelled / failed / retry_wait</text><text x="786" y="471" class="node-body">失败不撤销已发布原文</text></g><g class="node done" data-node="result"><rect x="70" y="544" width="294" height="100" rx="9"/><text x="86" y="564" class="state">已验收</text><text x="86" y="588" class="node-title">唯一、版本化结果</text><text x="86" y="610" class="node-body">重复运行不增结果</text><text x="86" y="629" class="node-body">保留输入与输出摘要</text></g><g class="node done" data-node="fence"><rect x="420" y="544" width="294" height="100" rx="9"/><text x="436" y="564" class="state">已验收</text><text x="436" y="588" class="node-title">拒绝旧 Worker 写入</text><text x="436" y="610" class="node-body">renew / checkpoint</text><text x="436" y="629" class="node-body">succeed / fail 均拒绝</text></g><g class="node neutral" data-node="old"><rect x="770" y="544" width="294" height="100" rx="9"/><text x="786" y="564" class="state">上下文</text><text x="786" y="588" class="node-title">旧 outbox_event 独立</text><text x="786" y="610" class="node-body">只处理 composition_released</text><text x="786" y="629" class="node-body">不是 C2 作业输入</text></g></svg>