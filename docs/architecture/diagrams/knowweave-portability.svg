<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 772" role="img" aria-labelledby="portability-title portability-desc"><title id="portability-title">05 · C3 交换与 C4 恢复</title><desc id="portability-desc">C3 阅读快照交换已通过隔离整关验收；C4 全量备份和干净恢复已启动，尚未验收。</desc><style>
:root{--paper:#ffffff;--ink:#172338;--muted:#506078;--edge:#6b7b92;--line:#c7d0df;--done:#eaf5ee;--done-ink:#246547;--next:#ebf1ff;--next-ink:#294ea5;--planned:#f2f4f8;--planned-ink:#506078;--optional:#f3ecfb;--optional-ink:#714993;--neutral:#fafbfc;}
@media(prefers-color-scheme:dark){:root{--paper:#131b29;--ink:#e6edf7;--muted:#b0bdd0;--edge:#97a9c0;--line:#415269;--done:#163a2d;--done-ink:#8fd8b3;--next:#203758;--next-ink:#a7c2ff;--planned:#283447;--planned-ink:#c1ccdc;--optional:#382c49;--optional-ink:#d3b5f2;--neutral:#202b3b;}}
text{font-family:'Microsoft YaHei','PingFang SC',system-ui,sans-serif;fill:var(--ink)}.node rect{fill:var(--planned);stroke:var(--line);stroke-width:1}.node.done rect{fill:var(--done)}.node.next rect{fill:var(--next)}.node.optional rect{fill:var(--optional)}.node.neutral rect{fill:var(--neutral)}.state{font-size:11px;letter-spacing:1px;fill:var(--planned-ink)}.done .state{fill:var(--done-ink)}.next .state{fill:var(--next-ink)}.optional .state{fill:var(--optional-ink)}.node-title{font-size:16px;font-weight:600}.node-body{font-size:13px;fill:var(--muted)}.edge{fill:none;stroke:var(--edge);stroke-width:1.4}.optional-edge{stroke-dasharray:5 4}.edge-label{font-size:12px;fill:var(--muted)}</style><defs><marker id="portability-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--edge)"/></marker></defs><rect width="1120" height="772" fill="var(--paper)"/><path class="edge" d="M217,70 L217,42 L567,42 L567,70" marker-end="url(#portability-arrow)"/><rect x="360" y="21" width="64" height="19" fill="var(--paper)" opacity=".96"/><text class="edge-label" x="392" y="34" text-anchor="middle">固定输入</text><path class="edge" d="M567,70 L567,42 L917,42 L917,70" marker-end="url(#portability-arrow)"/><rect x="710" y="21" width="64" height="19" fill="var(--paper)" opacity=".96"/><text class="edge-label" x="742" y="34" text-anchor="middle">精确清单</text><path class="edge" d="M917,170 L917,228" marker-end="url(#portability-arrow)"/><rect x="922" y="178" width="64" height="19" fill="var(--paper)" opacity=".96"/><text class="edge-label" x="927" y="191" text-anchor="start">授权交付</text><path class="edge" d="M917,228 L917,200 L567,200 L567,228" marker-end="url(#portability-arrow)"/><rect x="710" y="179" width="64" height="19" fill="var(--paper)" opacity=".96"/><text class="edge-label" x="742" y="192" text-anchor="middle">受控导入</text><path class="edge" d="M567,228 L567,200 L217,200 L217,228" marker-end="url(#portability-arrow)"/><rect x="353.5" y="179" width="77" height="19" fill="var(--paper)" opacity=".96"/><text class="edge-label" x="392" y="192" text-anchor="middle">校验全通过</text><path class="edge" d="M217,386 L217,358 L567,358 L567,386" marker-end="url(#portability-arrow)"/><rect x="353.5" y="337" width="77" height="19" fill="var(--paper)" opacity=".96"/><text class="edge-label" x="392" y="350" text-anchor="middle">一致恢复点</text><path class="edge" d="M567,386 L567,358 L917,358 L917,386" marker-end="url(#portability-arrow)"/><rect x="690.5" y="337" width="103" height="19" fill="var(--paper)" opacity=".96"/><text class="edge-label" x="742" y="350" text-anchor="middle">不可变资产复制</text><path class="edge" d="M917,486 L917,515 L567,515 L567,544" marker-end="url(#portability-arrow)"/><rect x="827" y="495" width="90" height="19" fill="var(--paper)" opacity=".96"/><text class="edge-label" x="872" y="508" text-anchor="middle">校验完整备份</text><path class="edge" d="M567,544 L567,516 L217,516 L217,544" marker-end="url(#portability-arrow)"/><rect x="360" y="495" width="64" height="19" fill="var(--paper)" opacity=".96"/><text class="edge-label" x="392" y="508" text-anchor="middle">恢复验证</text><path class="edge optional-edge" d="M917,544 L917,516 L567,516 L567,544" marker-end="url(#portability-arrow)"/><rect x="703.5" y="495" width="77" height="19" fill="var(--paper)" opacity=".96"/><text class="edge-label" x="742" y="508" text-anchor="middle">补学习事实</text><g class="node done" data-node="view"><rect x="70" y="70" width="294" height="100" rx="9"/><text x="86" y="90" class="state">已验收</text><text x="86" y="114" class="node-title">C3 · 选定阅读快照</text><text x="86" y="136" class="node-body">精确版本 / 模式 / 原件选项</text><text x="86" y="155" class="node-body">按当前主体权限取范围</text></g><g class="node done" data-node="closure"><rect x="420" y="70" width="294" height="100" rx="9"/><text x="436" y="90" class="state">已验收</text><text x="436" y="114" class="node-title">只读一致快照求闭包</text><text x="436" y="136" class="node-body">块 / 位置 / 关系 / 审查 / 资产</text><text x="436" y="155" class="node-body">不泄露隐藏 ID 或计数</text></g><g class="node done" data-node="bundle"><rect x="770" y="70" width="294" height="100" rx="9"/><text x="786" y="90" class="state">已验收</text><text x="786" y="114" class="node-title">manifest + JSON + 原件</text><text x="786" y="136" class="node-body">逐对象摘要与格式版本</text><text x="786" y="155" class="node-body">HTML / Markdown 阅读副本</text></g><g class="node done" data-node="visible"><rect x="70" y="228" width="294" height="100" rx="9"/><text x="86" y="248" class="state">已验收</text><text x="86" y="272" class="node-title">原子发布导入批次</text><text x="86" y="294" class="node-body">同 ID 同字节复用</text><text x="86" y="313" class="node-body">失败无半可用视图</text></g><g class="node done" data-node="preflight"><rect x="420" y="228" width="294" height="100" rx="9"/><text x="436" y="248" class="state">已验收</text><text x="436" y="272" class="node-title">staging 校验与预检</text><text x="436" y="294" class="node-body">引用闭包 / 权限归属 / 路径</text><text x="436" y="313" class="node-body">摘要冲突或缺件即拒绝</text></g><g class="node done" data-node="delivery"><rect x="770" y="228" width="294" height="100" rx="9"/><text x="786" y="248" class="state">已验收</text><text x="786" y="272" class="node-title">重验权限后交付</text><text x="786" y="294" class="node-body">完成时及下载时再检查</text><text x="786" y="313" class="node-body">导入授权目标范围</text></g><g class="node next" data-node="pause"><rect x="70" y="386" width="294" height="100" rx="9"/><text x="86" y="406" class="state">实施中</text><text x="86" y="430" class="node-title">C4 · 受控写入维护窗</text><text x="86" y="452" class="node-body">先停 runtime / Worker</text><text x="86" y="471" class="node-body">全量封存验证后再开放</text></g><g class="node next" data-node="backup"><rect x="420" y="386" width="294" height="100" rx="9"/><text x="436" y="406" class="state">实施中</text><text x="436" y="430" class="node-title">一致数据库 + 资产清单</text><text x="436" y="452" class="node-body">源端与单机专项已通过</text><text x="436" y="471" class="node-body">独立完成收据尚未验收</text></g><g class="node planned" data-node="copy"><rect x="770" y="386" width="294" height="100" rx="9"/><text x="786" y="406" class="state">待建设</text><text x="786" y="430" class="node-title">复制至独立故障域</text><text x="786" y="452" class="node-body">保护清单引用的全部资产</text><text x="786" y="471" class="node-body">逐件校验后才能 complete</text></g><g class="node planned" data-node="check"><rect x="70" y="544" width="294" height="100" rx="9"/><text x="86" y="564" class="state">待建设</text><text x="86" y="588" class="node-title">核对后开放实例</text><text x="86" y="610" class="node-body">旧版 / 当前版 / 位置 / 权限</text><text x="86" y="629" class="node-body">关系与原字节完整一致</text></g><g class="node planned" data-node="restore"><rect x="420" y="544" width="294" height="100" rx="9"/><text x="436" y="564" class="state">待建设</text><text x="436" y="588" class="node-title">恢复到干净实例</text><text x="436" y="610" class="node-body">数据库 + 原件 / 失效租约处理</text><text x="436" y="629" class="node-body">可重建派生物后续重建</text></g><g class="node planned" data-node="future"><rect x="770" y="544" width="294" height="100" rx="9"/><text x="786" y="564" class="state">待建设</text><text x="786" y="588" class="node-title">P1-B 扩展恢复闭包</text><text x="786" y="610" class="node-body">学习事实 / 规则 / 产物 / 计划</text><text x="786" y="629" class="node-body">另做全链恢复验收</text></g></svg>