<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 772" role="img" aria-labelledby="deployment-title deployment-desc"><title id="deployment-title">06 · 目标部署与存储边界</title><desc id="deployment-desc">目标为私有单机 Linux + Compose。现有证明来自隔离验收环境，未部署成生产服务。</desc><style>
:root{--paper:#ffffff;--ink:#172338;--muted:#506078;--edge:#6b7b92;--line:#c7d0df;--done:#eaf5ee;--done-ink:#246547;--next:#ebf1ff;--next-ink:#294ea5;--planned:#f2f4f8;--planned-ink:#506078;--optional:#f3ecfb;--optional-ink:#714993;--neutral:#fafbfc;}
@media(prefers-color-scheme:dark){:root{--paper:#131b29;--ink:#e6edf7;--muted:#b0bdd0;--edge:#97a9c0;--line:#415269;--done:#163a2d;--done-ink:#8fd8b3;--next:#203758;--next-ink:#a7c2ff;--planned:#283447;--planned-ink:#c1ccdc;--optional:#382c49;--optional-ink:#d3b5f2;--neutral:#202b3b;}}
text{font-family:'Microsoft YaHei','PingFang SC',system-ui,sans-serif;fill:var(--ink)}.node rect{fill:var(--planned);stroke:var(--line);stroke-width:1}.node.done rect{fill:var(--done)}.node.next rect{fill:var(--next)}.node.optional rect{fill:var(--optional)}.node.neutral rect{fill:var(--neutral)}.state{font-size:11px;letter-spacing:1px;fill:var(--planned-ink)}.done .state{fill:var(--done-ink)}.next .state{fill:var(--next-ink)}.optional .state{fill:var(--optional-ink)}.node-title{font-size:16px;font-weight:600}.node-body{font-size:13px;fill:var(--muted)}.edge{fill:none;stroke:var(--edge);stroke-width:1.4}.optional-edge{stroke-dasharray:5 4}.edge-label{font-size:12px;fill:var(--muted)}</style><defs><marker id="deployment-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--edge)"/></marker></defs><rect width="1120" height="772" fill="var(--paper)"/><path class="edge" d="M217,70 L217,42 L567,42 L567,70" marker-end="url(#deployment-arrow)"/><rect x="368.25" y="21" width="47.5" height="19" fill="var(--paper)" opacity=".96"/><text class="edge-label" x="392" y="34" text-anchor="middle">HTTPS</text><path class="edge" d="M567,170 L567,199 L217,199 L217,228" marker-end="url(#deployment-arrow)"/><rect x="360" y="178" width="64" height="19" fill="var(--paper)" opacity=".96"/><text class="edge-label" x="392" y="191" text-anchor="middle">静态资源</text><path class="edge" d="M567,170 L567,228" marker-end="url(#deployment-arrow)"/><rect x="572" y="178" width="79.4" height="19" fill="var(--paper)" opacity=".96"/><text class="edge-label" x="577" y="191" text-anchor="start">受保护 API</text><path class="edge" d="M917,170 L917,228" marker-end="url(#deployment-arrow)"/><rect x="922" y="178" width="90" height="19" fill="var(--paper)" opacity=".96"/><text class="edge-label" x="927" y="191" text-anchor="start">发布固定构建</text><path class="edge" d="M567,328 L567,386" marker-end="url(#deployment-arrow)"/><rect x="572" y="336" width="64" height="19" fill="var(--paper)" opacity=".96"/><text class="edge-label" x="577" y="349" text-anchor="start">私有网络</text><path class="edge" d="M917,328 L917,357 L567,357 L567,386" marker-end="url(#deployment-arrow)"/><rect x="697" y="336" width="90" height="19" fill="var(--paper)" opacity=".96"/><text class="edge-label" x="742" y="349" text-anchor="middle">受限作业权限</text><path class="edge" d="M917,328 L917,386" marker-end="url(#deployment-arrow)"/><rect x="922" y="336" width="38" height="19" fill="var(--paper)" opacity=".96"/><text class="edge-label" x="927" y="349" text-anchor="start">只读</text><path class="edge" d="M567,328 L567,357 L217,357 L217,386" marker-end="url(#deployment-arrow)"/><rect x="336.35" y="336" width="111.3" height="19" fill="var(--paper)" opacity=".96"/><text class="edge-label" x="392" y="349" text-anchor="middle">受控上传 / 导出</text><path class="edge" d="M567,486 L567,544" marker-end="url(#deployment-arrow)"/><rect x="572" y="494" width="64" height="19" fill="var(--paper)" opacity=".96"/><text class="edge-label" x="577" y="507" text-anchor="start">一致备份</text><path class="edge optional-edge" d="M917,486 L917,544" marker-end="url(#deployment-arrow)"/><rect x="922" y="494" width="103" height="19" fill="var(--paper)" opacity=".96"/><text class="edge-label" x="927" y="507" text-anchor="start">按资产清单复制</text><path class="edge optional-edge" d="M567,544 L567,516 L917,516 L917,544" marker-end="url(#deployment-arrow)"/><rect x="692.85" y="495" width="98.30000000000001" height="19" fill="var(--paper)" opacity=".96"/><text class="edge-label" x="742" y="508" text-anchor="middle">数据库 + 清单</text><g class="node planned" data-node="browser"><rect x="70" y="70" width="294" height="100" rx="9"/><text x="86" y="90" class="state">待建设</text><text x="86" y="114" class="node-title">浏览器 / HTTPS</text><text x="86" y="136" class="node-body">唯一面向用户的入口</text><text x="86" y="155" class="node-body">电脑 / 平板 / 手机</text></g><g class="node planned" data-node="gateway"><rect x="420" y="70" width="294" height="100" rx="9"/><text x="436" y="90" class="state">待建设</text><text x="436" y="114" class="node-title">反向代理 / TLS</text><text x="436" y="136" class="node-body">同源静态 Web 与 API</text><text x="436" y="155" class="node-body">P1-A 部署时配置</text></g><g class="node planned" data-node="management"><rect x="770" y="70" width="294" height="100" rx="9"/><text x="786" y="90" class="state">待建设</text><text x="786" y="114" class="node-title">受控运维入口</text><text x="786" y="136" class="node-body">部署 / 迁移 / 恢复管理</text><text x="786" y="155" class="node-body">高权凭据单独保管</text></g><g class="node planned" data-node="web"><rect x="70" y="228" width="294" height="100" rx="9"/><text x="86" y="248" class="state">待建设</text><text x="86" y="272" class="node-title">Web 静态资源</text><text x="86" y="294" class="node-body">受控内容渲染 / 草稿缓冲</text><text x="86" y="313" class="node-body">不执行 Notebook</text></g><g class="node planned" data-node="api"><rect x="420" y="228" width="294" height="100" rx="9"/><text x="436" y="248" class="state">待建设</text><text x="436" y="272" class="node-title">API 运行角色</text><text x="436" y="294" class="node-body">服务端身份与业务授权</text><text x="436" y="313" class="node-body">后续独立进程</text></g><g class="node done" data-node="worker"><rect x="770" y="228" width="294" height="100" rx="9"/><text x="786" y="248" class="state">已验收</text><text x="786" y="272" class="node-title">Worker 运行角色</text><text x="786" y="294" class="node-body">C2 容器隔离已验收</text><text x="786" y="313" class="node-body">仅 runtime secret / 只读资产</text></g><g class="node neutral" data-node="staging"><rect x="70" y="386" width="294" height="100" rx="9"/><text x="86" y="406" class="state">上下文</text><text x="86" y="430" class="node-title">staging / derived</text><text x="86" y="452" class="node-body">临时工作 / 可重建派生缓存</text><text x="86" y="471" class="node-body">各自寿命，不冒充权威正文</text></g><g class="node done" data-node="pg"><rect x="420" y="386" width="294" height="100" rx="9"/><text x="436" y="406" class="state">已验收</text><text x="436" y="430" class="node-title">内部 PostgreSQL</text><text x="436" y="452" class="node-body">postgres 独立持久卷</text><text x="436" y="471" class="node-body">业务事实与持久任务</text></g><g class="node done" data-node="assets"><rect x="770" y="386" width="294" height="100" rx="9"/><text x="786" y="406" class="state">已验收</text><text x="786" y="430" class="node-title">assets 独立持久卷</text><text x="786" y="452" class="node-body">不可变原字节 / SHA-256</text><text x="786" y="471" class="node-body">当前为 filesystem 后端</text></g><g class="node next" data-node="backup"><rect x="420" y="544" width="294" height="100" rx="9"/><text x="436" y="564" class="state">实施中</text><text x="436" y="588" class="node-title">C4 备份协调器</text><text x="436" y="610" class="node-body">维护窗与一致性清单</text><text x="436" y="629" class="node-body">管理权限与运行角色分开</text></g><g class="node planned" data-node="remote"><rect x="770" y="544" width="294" height="100" rx="9"/><text x="786" y="564" class="state">待建设</text><text x="786" y="588" class="node-title">独立备份副本</text><text x="786" y="610" class="node-body">另一故障域 / 可校验保留集</text><text x="786" y="629" class="node-body">密钥另存；恢复到干净实例</text></g></svg>