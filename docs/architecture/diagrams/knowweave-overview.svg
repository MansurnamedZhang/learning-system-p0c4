rview-arrow)"/><rect x="353.5" y="336" width="77" height="19" fill="var(--paper)" opacity=".96"/><text class="edge-label" x="392" y="349" text-anchor="middle">校验与编排</text><path class="edge" d="M917,328 L917,386" marker-end="url(#overview-arrow)"/><rect x="922" y="336" width="77" height="19" fill="var(--paper)" opacity=".96"/><text class="edge-label" x="927" y="349" text-anchor="start">原件与引用</text><path class="edge" d="M217,486 L217,544" marker-end="url(#overview-arrow)"/><rect x="222" y="494" width="64" height="19" fill="var(--paper)" opacity=".96"/><text class="edge-label" x="227" y="507" text-anchor="start">事务读写</text><path class="edge" d="M917,486 L917,544" marker-end="url(#overview-arrow)"/><rect x="922" y="494" width="158.6" height="19" fill="var(--paper)" opacity=".96"/><text class="edge-label" x="927" y="507" text-anchor="start">校验 / 定稿 / 授权读取</text><path class="edge" d="M917,486 L917,515 L217,515 L217,544" marker-end="url(#overview-arrow)"/><rect x="704.2" y="496" width="171.6" height="19" fill="var(--paper)" opacity=".96"/><text class="edge-label" x="790" y="509" text-anchor="middle">元数据 / 精确使用 / 授权</text><path class="edge optional-edge" d="M70,278 L40,278 L40,594 L70,594" marker-end="url(#overview-arrow)"/><rect x="40" y="340" width="64" height="19" fill="var(--paper)" opacity=".96"/><text class="edge-label" x="45" y="353" text-anchor="start">学习事实</text><path class="edge" d="M567,486 L567,515 L217,515 L217,544" marker-end="url(#overview-arrow)"/><rect x="325.7" y="494" width="132.6" height="19" fill="var(--paper)" opacity=".96"/><text class="edge-label" x="392" y="507" text-anchor="middle">转投 / 租约 / 结果</text><path class="edge" d="M567,386 L567,358 L917,358 L917,386" marker-end="url(#overview-arrow)"/><rect x="697" y="337" width="90" height="19" fill="var(--paper)" opacity=".96"/><text class="edge-label" x="742" y="350" text-anchor="middle">复用精确授权</text><path class="edge optional-edge" d="M567,486 L567,544" marker-end="url(#overview-arrow)"/><rect x="572" y