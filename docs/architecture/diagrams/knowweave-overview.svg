<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 930" role="img" aria-labelledby="overview-title overview-desc"><title id="overview-title">01 · 全系统架构总览</title><desc id="overview-desc">模块化单体：共享业务契约，API 与 Worker 分进程；首版单机部署。</desc><style>
